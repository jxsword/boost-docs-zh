<a name="tools"></a>第 II 部分 Boost 工具</h1></div></div></div>
<div class="partintro">
<div></div>
<p>Boost 的开发者、测试者与维护者开发了各种程序来帮助管理 Boost 库. 与 Boost 的其他一切一样, 这些工具以源代码形式提供, 并且是常规 Boost 发行版的组成部分.</p>
<p>在把 Boost 库移植到新平台时, 或者在自己的应用中使用时, 用户可能会发现这些工具很有用.</p>

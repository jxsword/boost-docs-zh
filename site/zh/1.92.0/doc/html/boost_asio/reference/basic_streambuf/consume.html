<div class="titlepage"><div><div><h4 class="title">
<a name="boost_asio.reference.basic_streambuf.consume"></a><a class="link" href="consume.html" title="basic_streambuf::consume">basic_streambuf::consume</a>
</h4></div></div></div>
<p>
          <a class="indexterm" name="boost_asio.indexterm.basic_streambuf.consume"></a> 从输入序列中移除字符.</p>
<pre class="programlisting"><span class="keyword">void</span> <span class="identifier">consume</span><span class="special">(</span>
    <span class="identifier">std</span><span class="special">::</span><span class="identifier">size_t</span> <span class="identifier">n</span><span class="special">);</span>
</pre>
<p>从输入序列开头移除 <code class="computeroutput"><span class="identifier">n</span></code> 个字符.</p>
<h6>
<a name="boost_asio.reference.basic_streambuf.consume.h0"></a>
          <span class="phrase"><a name="boost_asio.reference.basic_streambuf.consume.remarks"></a></span><a class="link" href="consume.html#boost_asio.reference.basic_streambuf.consume.remarks">备注</a>
        </h6>
<p>如果 <code class="computeroutput"><span class="identifier">n</span></code> 大于输入序列的大小, 则整个输入序列被消费, 且不发出任何错误.</p>

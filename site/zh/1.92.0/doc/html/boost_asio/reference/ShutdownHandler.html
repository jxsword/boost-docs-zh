<div class="titlepage"><div><div><h3 class="title">
<a name="boost_asio.reference.ShutdownHandler"></a><a class="link" href="ShutdownHandler.html" title="SSL 关闭处理器要求">SSL 关闭处理器要求</a>
</h3></div></div></div>
<p>关闭处理器必须满足 <a class="link" href="Handler.html" title="处理器">处理器</a> 的要求. 关闭处理器类的值 <code class="computeroutput"><span class="identifier">h</span></code> 应能在表达式 <code class="computeroutput"><span class="identifier">h</span><span class="special">(</span><span class="identifier">ec</span><span class="special">)</span></code> 中正确工作, 其中 <code class="computeroutput"><span class="identifier">ec</span></code> 是类型为 <code class="computeroutput"><span class="keyword">const</span> <span class="identifier">error_code</span></code> 的左值.</p>

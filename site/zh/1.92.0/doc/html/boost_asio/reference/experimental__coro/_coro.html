<div class="titlepage"><div><div><h4 class="title">
<a name="boost_asio.reference.experimental__coro._coro"></a><a class="link" href="_coro.html" title="experimental::coro::~coro">experimental::coro::~coro</a>
</h4></div></div></div>
<p>
          <a class="indexterm" name="boost_asio.indexterm.experimental__coro._coro"></a> 析构函数. 若其持有一个有效协程, 则销毁该协程.</p>
<pre class="programlisting"><span class="special">~</span><span class="identifier">coro</span><span class="special">();</span>
</pre>
<h6>
<a name="boost_asio.reference.experimental__coro._coro.h0"></a>
          <span class="phrase"><a name="boost_asio.reference.experimental__coro._coro.remarks"></a></span><a class="link" href="_coro.html#boost_asio.reference.experimental__coro._coro.remarks">备注</a>
        </h6>
<p>这不会取消一个正在运行的协程. 销毁一个可恢复协程, 即其 async_resume 调用尚未完成的协程, 属于未定义行为.</p>

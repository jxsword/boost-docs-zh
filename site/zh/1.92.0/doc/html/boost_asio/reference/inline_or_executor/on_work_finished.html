<p>
          <a class="indexterm" name="boost_asio.indexterm.inline_or_executor.on_work_finished"></a> 通知 <a class="link" href="../inline_or_executor.html" title="inline_or_executor"><code class="computeroutput"><span class="identifier">inline_or_executor</span></code></a> 一些工作已不再处于未完成状态.</p>
<pre class="programlisting"><span class="keyword">void</span> <span class="identifier">on_work_finished</span><span class="special">()</span> <span class="keyword">const</span><span class="special">;</span>
</pre>
<p>该 <a class="link" href="../inline_or_executor.html" title="inline_or_executor"><code class="computeroutput"><span class="identifier">inline_or_executor</span></code></a> 把这次调用委托给其底层执行器.</p>

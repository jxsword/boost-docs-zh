<p>
          <a class="indexterm" name="boost_asio.indexterm.ip__address_v4.loopback"></a> 获取一个表示环回地址的地址对象.</p>
<pre class="programlisting"><span class="keyword">static</span> <span class="identifier">address_v4</span> <span class="identifier">loopback</span><span class="special">();</span>
</pre>
<p>此函数返回一个表示众所周知的环回地址 <code class="computeroutput"><span class="number">127.0</span><span class="special">.</span><span class="number">0.1</span></code>.</p>
<h6>
<a name="boost_asio.reference.ip__address_v4.loopback.h0"></a>
          <span class="phrase"><a name="boost_asio.reference.ip__address_v4.loopback.return_value"></a></span><a class="link" href="loopback.html#boost_asio.reference.ip__address_v4.loopback.return_value">返回值</a>
        </h6>
<p>
          <code class="computeroutput"><span class="identifier">address_v4</span><span class="special">(</span><span class="number">0x7F000001</span><span class="special">)</span></code>.
        </p>

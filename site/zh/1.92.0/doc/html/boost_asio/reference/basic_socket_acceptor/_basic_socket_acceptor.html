<p>
          <a class="indexterm" name="boost_asio.indexterm.basic_socket_acceptor._basic_socket_acceptor"></a> 销毁接受器.</p>
<pre class="programlisting"><span class="special">~</span><span class="identifier">basic_socket_acceptor</span><span class="special">();</span>
</pre>
<p>此函数销毁接受器, 如同调用 <code class="computeroutput"><span class="identifier">cancel</span></code> 一样, 取消与接受器关联的所有未完成的异步操作.</p>

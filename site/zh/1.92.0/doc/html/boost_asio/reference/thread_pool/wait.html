<div class="titlepage"><div><div><h4 class="title">
<a name="boost_asio.reference.thread_pool.wait"></a><a class="link" href="wait.html" title="thread_pool::wait">thread_pool::wait</a>
</h4></div></div></div>
<p>
          <a class="indexterm" name="boost_asio.indexterm.thread_pool.wait"></a>等待各线程完成.</p>
<pre class="programlisting"><span class="keyword">void</span> <span class="identifier">wait</span><span class="special">();</span>
</pre>
<p>此函数阻塞, 直到线程池中的线程全部完成. 如果在 <code class="computeroutput"><span class="identifier">stop</span><span class="special">()</span></code> 之前没有调用 <code class="computeroutput"><span class="identifier">wait</span><span class="special">()</span></code>, 则 <code class="computeroutput"><span class="identifier">wait</span><span class="special">()</span></code> 调用将等待线程池没有更多未完成的工作为止.</p>
<h6>
<a name="boost_asio.reference.thread_pool.wait.h0"></a>
          <span class="phrase"><a name="boost_asio.reference.thread_pool.wait.remarks"></a></span><a class="link" href="wait.html#boost_asio.reference.thread_pool.wait.remarks">备注</a>
        </h6>
<p>
          <code class="computeroutput"><span class="identifier">wait</span><span class="special">()</span></code> 与 <code class="computeroutput"><span class="identifier">join</span><span class="special">()</span></code> 同义.</p>

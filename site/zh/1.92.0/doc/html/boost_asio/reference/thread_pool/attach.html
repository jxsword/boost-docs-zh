<a name="boost_asio.reference.thread_pool.attach"></a><a class="link" href="attach.html" title="thread_pool::attach">thread_pool::attach</a>
</h4></div></div></div>
<p>
          <a class="indexterm" name="boost_asio.indexterm.thread_pool.attach"></a>将当前线程附加到线程池.</p>
<pre class="programlisting"><span class="keyword">void</span> <span class="identifier">attach</span><span class="special">();</span>
</pre>
<p>此函数把当前线程附加到线程池, 使其可用于执行提交的函数对象. 阻塞调用线程, 直到线程池已停止或已 join 且没有未完成的工作.</p>

<div class="titlepage"><div><div><h2 class="title" style="clear: both">
<a name="stl_interfaces.compiler_support"></a><a class="link" href="compiler_support.html" title="编译器支持">编译器支持</a>
</h2></div></div></div>
<p>Boost.STLInterfaces 是针对 C++14 标准编写的. 它以标准化为目标, 使其兼容 C++11 所需的改动被认为过于巨大.</p>
<p>Boost.STLInterfaces 应当可用于任何符合标准的 C++14 编译器. 它已在 Clang、GCC 与 Visual Studio 上测试.</p>

<div class="titlepage"><div><div><h2 class="title" style="clear: both">
<a name="boost_typeerasure.future"></a><a class="link" href="future.html" title="后续工作">后续工作</a>
</h2></div></div></div>
<p>这些只是一些想法. 绝不保证其中任何一项会被实现.</p>
<div class="itemizedlist"><ul class="itemizedlist" style="list-style-type: disc; ">
<li class="listitem">使用 SBO (小缓冲区优化).</li>
<li class="listitem">允许对 vtable 布局进行更多控制.</li>
<li class="listitem">尝试在转换中复用子表.</li>
<li class="listitem">允许 "dynamic_cast". 这需要创建一个全局的概念映射注册表.</li>
<li class="listitem">优化编译期开销.</li>
</ul></div>

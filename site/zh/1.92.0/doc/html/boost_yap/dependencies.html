<div class="titlepage"><div><div><h2 class="title" style="clear: both">
<a name="boost_yap.dependencies"></a><a class="link" href="dependencies.html" title="依赖">依赖</a>
</h2></div></div></div>
<p>Boost.YAP 直接依赖 Boost.Hana. 它还对 Boost.TypeIndex 有可选依赖. Boost.TypeIndex 用于类型打印, 仅在包含可选头文件 <code class="computeroutput"><span class="special">&lt;</span><span class="identifier">boost</span><span class="special">/</span><span class="identifier">yap</span><span class="special">/</span><span class="identifier">print</span><span class="special">.</span><span class="identifier">hpp</span><span class="special">&gt;</span></code> 时才需要.</p>

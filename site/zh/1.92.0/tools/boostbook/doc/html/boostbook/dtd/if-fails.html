<div class="refnamediv">
<h2><span class="refentrytitle"> BoostBook 元素 <code class="sgmltag-element">if-fails</code></span></h2>
<p>if-fails — 测试用例失败时意味着什么</p>
</div>
<h2 class="refsynopsisdiv-title">概要</h2>
<div class="refsynopsisdiv">if-fails ::= 
  (ANY)
</div>
<div class="refsection">
<a name="id3168"></a><h2>说明</h2>
<p>向用户描述某个失败的测试用例会对库的可用性产生什么影响. 当测试用例失败并不意味着库不可用、但可能意味着某些库特性将不可用时, 此字段很有用.</p>

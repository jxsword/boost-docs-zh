<div class="titlepage"><div><div><h2 class="title" style="clear: both">
<a name="boostbook.setup.troubleshooting"></a>故障排除</h2></div></div></div>
<p>Boost 文档工具仍处于开发的早期阶段, 有些东西还不能像我们期望的那样无缝工作. 特别是, 错误消息有时可能信息不足. 如果你反复检查了一切、而事情仍然不如预期, 可以考虑通过删除 <code class="literal">bin.v2</code> 构建目录来帮这些工具一把.</p>

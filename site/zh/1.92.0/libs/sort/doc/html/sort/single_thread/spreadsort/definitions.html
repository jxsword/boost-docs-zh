<h5>
<a name="sort.single_thread.spreadsort.definitions.h0"></a>
          <span class="phrase"><a name="sort.single_thread.spreadsort.definitions.stable_sort"></a></span><a class="link" href="definitions.html#sort.single_thread.spreadsort.definitions.stable_sort">稳定排序</a>
        </h5>
<p>一种保留原有顺序的排序方式. 如果列表中有两个键相同的元素, 之后进行稳定排序, 则在初始列表中先出现的元素在稳定排序后的列表中也会先出现. 此处提供的算法不提供这种保证; 键相同的元素之间的最终顺序是任意的.</p>

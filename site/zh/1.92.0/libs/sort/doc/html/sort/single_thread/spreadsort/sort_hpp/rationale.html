<div class="section">
<div class="titlepage"><div><div><h6 class="title">
<a name="sort.single_thread.spreadsort.sort_hpp.rationale.radix_sorting"></a><a class="link" href="rationale.html#sort.single_thread.spreadsort.sort_hpp.rationale.radix_sorting" title="基数排序">基数排序</a>
</h6></div></div></div>
<p>基于基数的排序允许每轮迭代把数据划分为多于 2 份; 对于缓存友好的版本, 通常每轮迭代把数据切成约一千份. 这样只需少得多的迭代轮数即可完成数据排序, 使性能超越 <span class="emphasis"><em>𝑶(N*log(N))</em></span> 的基于比较排序的极限.</p>

</h4></div></div></div>
<p>本库的所有整数类型都可以作为<code class="computeroutput"><span class="identifier">boost</span><span class="special">::</span><span class="identifier">rational</span><span class="special">&lt;</span><span class="identifier">IntType</span><span class="special">&gt;</span></code> 的模板参数使用.</p>
<p>注意, 以这种方式使用本库会在很大程度上抵消<code class="computeroutput"><span class="identifier">number</span></code> 中表达式模板的效果.</p>

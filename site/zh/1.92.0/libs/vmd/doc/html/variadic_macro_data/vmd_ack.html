<p>首先也是最重要的, 我要感谢 Paul Mensonides 为处理变参宏和一般宏提供了建议, 解释和代码. 其次, 我要感谢 Steve Watanabe 的帮助, 代码和解释. 最后, 我必须承认该库是处理变参宏本身已有技术的集大成之作, 其中包括 Paul Mensonides 在网上发布的技术. 我在创建该库时加入了自己的设计和一些巧思, 但如果没有前人积累的知识, 我不可能做到这一点.</p>

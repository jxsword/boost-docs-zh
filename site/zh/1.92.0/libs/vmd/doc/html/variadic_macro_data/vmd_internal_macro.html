<div class="titlepage"><div><div><h2 class="title" style="clear: both">
<a name="variadic_macro_data.vmd_internal_macro"></a><a class="link" href="vmd_internal_macro.html" title="控制内部使用">控制内部使用</a>
</h2></div></div></div>
<p>宏 BOOST_VMD_ASSERT_DATA 控制断言宏是否检查其数据. 默认行为是: 在编译器调试模式下检查数据, 而在编译器发布模式下不检查数据. 最终用户可以在包含 VMD 头文件之前将该宏设置为 0 以不检查数据, 或设置为非 0 以检查数据; 如有必要, 也可以在包含 VMD 头文件之后检查该值.</p>

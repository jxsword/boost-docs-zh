<h2><span class="refentrytitle">宏 BOOST_VMD_TUPLE_POP_BACK</span></h2>
<p>BOOST_VMD_TUPLE_POP_BACK — 从元组末尾弹出一个元素.</p>
</div>
<h2 class="refsynopsisdiv-title">概要</h2>
<div class="refsynopsisdiv"><pre class="synopsis"><span class="comment">// In header: &lt;<a class="link" href="tuple_2pop__back_8hpp.html" title="头文件 &lt;boost/vmd/tuple/pop_back.hpp&gt;">boost/vmd/tuple/pop_back.hpp</a>&gt;

</span>BOOST_VMD_TUPLE_POP_BACK(tuple)</pre></div>
<div class="refsect1">
<a name="id16392"></a><h2>说明</h2>
<p>tuple = 要从中弹出元素的元组.</p>
<p>如果元组是空元组, 结果未定义. 如果元组是单个元素, 结果是一个空元组. 否则结果是移除最后一个元素之后的元组.</p>

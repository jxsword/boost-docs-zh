<h2><span class="refentrytitle">宏 BOOST_VMD_TUPLE_TO_LIST</span></h2>
<p>BOOST_VMD_TUPLE_TO_LIST — 将元组转换为列表.</p>
</div>
<h2 class="refsynopsisdiv-title">概要</h2>
<div class="refsynopsisdiv"><pre class="synopsis"><span class="comment">// In header: &lt;<a class="link" href="tuple_2to__list_8hpp.html" title="头文件 &lt;boost/vmd/tuple/to_list.hpp&gt;">boost/vmd/tuple/to_list.hpp</a>&gt;

</span>BOOST_VMD_TUPLE_TO_LIST(tuple)</pre></div>
<div class="refsect1">
<a name="id16812"></a><h2>说明</h2>
<p>tuple = 要转换的元组.</p>
<p>如果元组是空元组, 则将其转换为空列表 (BOOST_PP_NIL). 否则将该元组转换为与该元组元素数量相同的列表.</p>

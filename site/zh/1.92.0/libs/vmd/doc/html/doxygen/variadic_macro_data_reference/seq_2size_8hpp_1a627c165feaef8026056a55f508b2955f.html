<h2><span class="refentrytitle">宏 BOOST_VMD_SEQ_SIZE</span></h2>
<p>BOOST_VMD_SEQ_SIZE — 展开为传递给它的 seq 的大小.</p>
</div>
<h2 class="refsynopsisdiv-title">概要</h2>
<div class="refsynopsisdiv"><pre class="synopsis"><span class="comment">// In header: &lt;<a class="link" href="seq_2size_8hpp.html" title="头文件 &lt;boost/vmd/seq/size.hpp&gt;">boost/vmd/seq/size.hpp</a>&gt;

</span>BOOST_VMD_SEQ_SIZE(seq)</pre></div>
<div class="refsect1">
<a name="id16608"></a><h2>说明</h2>
<p>seq = 要提取其大小的 seq.</p>
<p>如果 seq 是空 seq, 其大小为 0. 否则结果是 seq 中元素的数量.</p>

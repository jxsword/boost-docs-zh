<h2><span class="refentrytitle">宏 BOOST_VMD_ARRAY_TO_TUPLE</span></h2>
<p>BOOST_VMD_ARRAY_TO_TUPLE — 将数组转换为元组.</p>
</div>
<h2 class="refsynopsisdiv-title">概要</h2>
<div class="refsynopsisdiv"><pre class="synopsis"><span class="comment">// In header: &lt;<a class="link" href="array_2to__tuple_8hpp.html" title="头文件 &lt;boost/vmd/array/to_tuple.hpp&gt;">boost/vmd/array/to_tuple.hpp</a>&gt;

</span>BOOST_VMD_ARRAY_TO_TUPLE(array)</pre></div>
<div class="refsect1">
<a name="id16924"></a><h2>说明</h2>
<p>array = 要转换的数组.</p>
<p>如果该数组是 0 个元素的数组, 则将其转换为空元组. 否则将该数组转换为与该数组元素数量相同的元组.</p>

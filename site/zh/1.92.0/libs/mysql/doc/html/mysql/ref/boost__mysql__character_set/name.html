<p>
          <a class="indexterm" name="id55292"></a> 字符集名称, 以 NULL 结尾的字符串.</p>
<h6>
<a name="mysql.ref.boost__mysql__character_set.name.h0"></a>
          <span class="phrase"><a name="mysql.ref.boost__mysql__character_set.name.synopsis"></a></span><a class="link" href="name.html#mysql.ref.boost__mysql__character_set.name.synopsis">概要</a>
        </h6>
<pre class="programlisting"><span class="keyword">const</span> <span class="keyword">char</span><span class="special">*</span> <span class="identifier">name</span><span class="special">;</span>
</pre>
<h6>
<a name="mysql.ref.boost__mysql__character_set.name.h1"></a>
          <span class="phrase"><a name="mysql.ref.boost__mysql__character_set.name.description"></a></span><a class="link" href="name.html#mysql.ref.boost__mysql__character_set.name.description">说明</a>
        </h6>
<p>它应与 MySQL 中的字符集名称一致. 即你发出 <code class="computeroutput"><span class="identifier">SET</span> <span class="identifier">NAMES</span></code> 语句时指定的字符串. 可以使用 <code class="computeroutput"><span class="identifier">SHOW</span>
          <span class="identifier">CHARACTER</span> <span class="identifier">SET</span></code> 语句查看可用的字符集.</p>

<div class="itemizedlist"><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem">Boost.Python 库名现在包含 Python 版本后缀. 用 Python 2.7 编译的变体因此会产生库名 <code class="computeroutput"><span class="identifier">boost_python27</span></code> 和 <code class="computeroutput"><span class="identifier">boost_numpy27</span></code> 等, 使为多个 Python 版本并排放置变体成为可能.</li></ul></div>

</h3></div></div></div>
<p>你应该不需要做任何特殊配置即可在你的编译器上使用 Boost.Regex - <a href="../../../../../config/index.html" target="_top">Boost.Config 子系统</a> 应该已经处理好了; 如果你确实遇到问题 (或者你使用的是特别冷僻的编译器或平台), 那么 <a href="../../../../../config/index.html" target="_top">Boost.Config</a> 提供了一个可以运行的 configure 脚本.</p>

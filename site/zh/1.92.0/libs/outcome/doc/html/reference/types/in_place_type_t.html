  <div class="titlepage"><div><div><h1 style="clear: both"><code>in_place_type_t&lt;T&gt;</code></h1></div></div></div>
  <p>要么是 <code>std::in_place_type_t&lt;T&gt;</code>, 要么是本地模拟, 取决于 <a href="../../reference/macros/in_place_type.html" class="api-reference"><code>BOOST_OUTCOME_USE_STD_IN_PLACE_TYPE</code></a> 宏.</p>

<p>注意, 模板化变量 <code>in_place_type</code> 也会被别名或在本地模拟.</p>

<p><em>要求</em>: 无.</p>

<p><em>命名空间</em>: <code>BOOST_OUTCOME_V2_NAMESPACE</code></p>

<p><em>头文件</em>: <code>&lt;boost/outcome/config.hpp&gt;</code></p>

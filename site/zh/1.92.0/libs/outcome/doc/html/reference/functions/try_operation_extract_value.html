  <div class="titlepage"><div><div><h1 style="clear: both"><code>decltype(auto) try_operation_extract_value(X)</code></h1></div></div></div>
  <p>该默认实现返回 <code>.assume_value()</code> 或 <code>.value()</code> 成员函数所返回的东西; 当两者都可用时优先选择前者.</p>

<p><em>要求</em>: 表达式 <code>std::declval&lt;T&gt;().assume_value()</code> 和/或 <code>std::declval&lt;T&gt;().value()</code> 是有效表达式.</p>

<p><em>命名空间</em>: <code>BOOST_OUTCOME_V2_NAMESPACE</code></p>

<p><em>头文件</em>: <code>&lt;boost/outcome/try.hpp&gt;</code></p>

  <div class="titlepage"><div><div><h1 style="clear: both"><code>all_narrow</code></h1></div></div></div>
  <p>规定在不正确的窄与宽值、错误或异常观察时发生硬性未定义行为的策略类.</p>

<p>公开继承自 <a href="../../reference/policies/base.html" class="api-reference"><code>base</code></a>, 只是把其宽值、错误与异常观察器策略定义为调用对应的窄版本.</p>

<p>由 <code>&lt;basic_result.hpp&gt;</code> 包含, 因此当 <code>basic_result</code> 可用时总是可用.</p>

<p><em>要求</em>: 无.</p>

<p><em>命名空间</em>: <code>BOOST_OUTCOME_V2_NAMESPACE::policy</code></p>

<p><em>头文件</em>: <code>&lt;boost/outcome/policy/all_narrow.hpp&gt;</code></p>

  <div class="titlepage"><div><div><h1 style="clear: both"><code>BOOST_OUTCOME_ENABLE_LEGACY_SUPPORT_FOR</code></h1></div></div></div>
  <p>随着 Outcome 的演进, 一些特性——尤其是命名——在更新版本中被退役. 定义本宏可启用从旧特性与命名到新特性与命名的向后兼容别名.</p>

<p><em>可覆盖</em>: 在包含之前定义.</p>

<p><em>默认</em>: 当前 Outcome 版本, 以百位数表示, 例如 Outcome v2.10 是 <code>210</code>.</p>

<p><em>头文件</em>: <code>&lt;boost/outcome/config.hpp&gt;</code></p>

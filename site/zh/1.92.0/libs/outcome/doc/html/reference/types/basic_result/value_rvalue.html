  <div class="titlepage"><div><div><h1 style="clear: both"><code>value_type &amp;&amp;value() &amp;&amp;</code></h1></div></div></div>
  <p>对所存任意值的宽契约右值引用观察器. 先调用 <code>NoValuePolicy::wide_value_check()</code>, 然后返回值的引用.</p>

<p>注意, 如果 <code>value_type</code> 为 <code>void</code>, 只存在一个 <code>const</code> 重载, 返回 <code>void</code>.</p>

<p><em>要求</em>: 始终可用.</p>

<p><em>复杂度</em>: 取决于 <code>NoValuePolicy::wide_value_check()</code>.</p>

<p><em>保证</em>: 无.</p>

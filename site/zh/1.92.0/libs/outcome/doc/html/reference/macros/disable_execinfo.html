  <div class="titlepage"><div><div><h1 style="clear: both"><code>BOOST_OUTCOME_DISABLE_EXECINFO</code></h1></div></div></div>
  <p>若定义, 则禁用 <code>&lt;execinfo.h&gt;</code> 头文件 (或 win32 模拟) 的使用.</p>

<p>一些嵌入式 Linux 工具链不定义 <code>&lt;execinfo.h&gt;</code>, 因此在这些工具链上禁用 C++ 异常会导致找不到该文件. 通过定义本宏完全禁用栈回溯支持, 可以避开该问题.</p>

<p><em>可覆盖</em>: 在包含之前定义.</p>

<p><em>默认</em>: 若 <code>__ANDROID__</code> 有定义则有定义, 否则未定义.</p>

<p><em>头文件</em>: <code>&lt;boost/outcome/config.hpp&gt;</code></p>

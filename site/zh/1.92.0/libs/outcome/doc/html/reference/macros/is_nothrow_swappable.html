  <div class="titlepage"><div><div><h1 style="clear: both"><code>BOOST_OUTCOME_USE_STD_IS_NOTHROW_SWAPPABLE</code></h1></div></div></div>
  <p>是否把 <code>is_nothrow_swappable&lt;T&gt;</code> 实现为 <code>std::is_nothrow_swappable&lt;T&gt;</code>, 否则使用本地模拟.</p>

<p><em>可覆盖</em>: 在包含之前定义.</p>

<p><em>默认</em>: 如果当前编译器实现 C++ 17 或更高, 在未设置时本宏默认为 <code>1</code>, 否则默认为 <code>0</code>.</p>

<p><em>头文件</em>: <code>&lt;boost/outcome/config.hpp&gt;</code></p>

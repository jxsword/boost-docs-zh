  <div class="titlepage"><div><div><h1 style="clear: both"><code>BOOST_OUTCOME_THREAD_LOCAL</code></h1></div></div></div>
  <p>编译器特定标记, 用于把变量标记为具有线程局部存储期.</p>

<div class="notices note" style="background: url('../../images/note.png') top left no-repeat padding-box padding-box;">
<div class="notices heading">注释</div>
<div class="notices message"><p>Outcome 内部不使用它, 但其单元测试套件使用它.</p>
</div>
</div>


<p><em>可覆盖</em>: 在包含之前定义.</p>

<p><em>默认</em>: 为 <code>thread_local</code>——当编译器实现 C++ 11 的 <code>thread_local</code> 时; 否则为 <code>__thread</code>, 用于那个不支持的编译器 (较老的 Mac OS XCode).</p>

<p><em>头文件</em>: <code>&lt;boost/outcome/config.hpp&gt;</code></p>

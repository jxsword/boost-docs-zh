  <div class="titlepage"><div><div><h1 style="clear: both"><code>basic_result(const basic_result &amp;)</code></h1></div></div></div>
  <p>拷贝构造函数.</p>

<p><em>要求</em>: <code>value_type</code> 与 <code>error_type</code> 都实现拷贝构造函数.</p>

<p><em>复杂度</em>: 与 <code>value_type</code> 与 <code>error_type</code> 的拷贝构造函数相同. 底层操作的 constexpr、平凡性与 noexcept 会被传播.</p>

<p><em>保证</em>: 如果操作期间抛出异常, 对象会处于部分完成状态, 与对 <code>struct</code> 执行相同操作的通常规则一致.</p>

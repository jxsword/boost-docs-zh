  <div class="titlepage"><div><div><h1 style="clear: both"><code>auto as_failure() &amp;&amp;</code></h1></div></div></div>
  <p>返回自由函数 <a href="../../../reference/functions/failure.html" class="api-reference"><code>auto failure(T &amp;&amp;, ...)</code></a> 的输出, 包含从任何出错状态的移动, 从而把 result 的错误值留在已移动源状态. 依据 <code>error_type</code> 的选择, 该函数因此可能是破坏性的. 错误状态使用 <a href="../../../reference/types/basic_outcome/assume_error_rvalue.html" class="api-reference"><code>error_type &amp;&amp;assume_error() &amp;&amp; noexcept</code></a> 访问.</p>

<p><em>要求</em>: 始终可用.</p>

<p><em>复杂度</em>: 取决于 <code>error_type</code> 的移动构造函数.</p>

<p><em>保证</em>: 无.</p>

  <div class="titlepage"><div><div><h1 style="clear: both"><code>bool has_exception() const noexcept</code></h1></div></div></div>
  <p>对 <code>basic_result</code> 总是返回 false. 尽可能 constexpr.</p>

<p><em>要求</em>: 始终可用.</p>

<p><em>复杂度</em>: 常量时间.</p>

<p><em>保证</em>: 永不抛出异常.</p>

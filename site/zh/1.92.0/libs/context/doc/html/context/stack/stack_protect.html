<div class="titlepage"><div><div><h3 class="title">
<a name="context.stack.stack_protect"></a><a class="link" href="stack_protect.html" title="对栈保护的支持">对栈保护的支持</a>
</h3></div></div></div>
<p>编译器开关 <code class="computeroutput"><span class="special">-</span><span class="identifier">fstack</span><span class="special">-</span><span class="identifier">protector</span></code> 会改变默认的上下文切换逻辑. 用户在启用栈保护的情况下, 必须在包含任何 Boost.Context 头文件之前定义 <code class="computeroutput"><span class="identifier">BOOST_CONTEXT_TLS_STACK_PROTECTOR</span></code> .</p>

<div class="section">
<div class="titlepage"><div><div><h4 class="title">
<a name="boost_test.utf_reference.test_org_reference.test_org_boost_test_global_fixture"></a><a class="link" href="test_org_boost_test_global_fixture.html" title="BOOST_TEST_GLOBAL_FIXTURE"><code class="computeroutput"><span class="identifier">BOOST_TEST_GLOBAL_FIXTURE</span></code></a>
</h4></div></div></div>
<p>声明并注册一个全局夹具. 全局夹具的行为与附加到 <a class="link" href="../../tests_organization/test_tree/master_test_suite.html" title="主测试套件">主测试套件</a> 的套件夹具完全相同, 并在测试树中任何测试用例执行之前被调用.</p>
<p>实现夹具的类应当具有相应的 <a class="link" href="../../tests_organization/fixtures/models.html" title="夹具模型">接口</a>. 与任何夹具一样, 全局夹具中可以包含测试断言.</p>
<p>详见 <a class="link" href="../../tests_organization/fixtures/global.html" title="全局夹具">此处</a>.</p>

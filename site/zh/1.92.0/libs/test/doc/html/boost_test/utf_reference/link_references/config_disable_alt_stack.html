<div class="section">
<div class="titlepage"><div><div><h4 class="title">
<a name="boost_test.utf_reference.link_references.config_disable_alt_stack"></a><a class="link" href="config_disable_alt_stack.html" title="BOOST_TEST_DISABLE_ALT_STACK"><code class="computeroutput"><span class="identifier">BOOST_TEST_DISABLE_ALT_STACK</span></code></a>
</h4></div></div></div>
<p>禁用备选栈支持.</p>
<p>在包含任何<span class="emphasis"><em>单元测试框架</em></span>头文件之前定义该宏, 以禁用对<a href="http://www.gnu.org/software/libc/manual/html_node/Signal-Stack.html" target="_top">备选栈</a>的支持, 以防你的编译器不支持它而<span class="emphasis"><em>单元测试框架</em></span>无法自动探测到这种缺失.</p>
<p>更多细节见<a class="link" href="../rt_param_reference/use_alt_stack.html" title="use_alt_stack"><code class="computeroutput"><span class="identifier">use_alt_stack</span></code></a>和<code class="computeroutput"><a class="link" href="../../../doxygen/a00719_1a51fdd44d8f52e01d58df4f316ff61471.html" title="Macro BOOST_TEST_DISABLE_ALT_STACK">BOOST_TEST_DISABLE_ALT_STACK</a></code>.</p>

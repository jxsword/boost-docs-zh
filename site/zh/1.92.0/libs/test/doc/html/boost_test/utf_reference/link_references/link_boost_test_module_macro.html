<p>与宏<a class="link" href="link_boost_test_main_macro.html" title="BOOST_TEST_MAIN"><code class="computeroutput"><span class="identifier">BOOST_TEST_MAIN</span></code></a>用途相同, 但此外还定义主测试套件的名称.</p>
<div class="caution"><table border="0" summary="Caution">
<tr>
<td rowspan="2" align="center" valign="top" width="25"><img alt="[注意]" src="../../../../../../../doc/src/images/caution.png"></td>

</tr>
<tr><td align="left" valign="top">
<p>与<a class="link" href="link_boost_test_main_macro.html" title="BOOST_TEST_MAIN"><code class="computeroutput"><span class="identifier">BOOST_TEST_MAIN</span></code></a>一样, 该宏应当</p>
<div class="orderedlist"><ol class="orderedlist" type="1">
<li class="listitem">在对<span class="emphasis"><em>单元测试框架</em></span>头文件的任何包含指令之前定义</li>
<li class="listitem">恰好在你测试模块的一个编译单元中定义</li>
</ol></div>
</td></tr>
</table></div>

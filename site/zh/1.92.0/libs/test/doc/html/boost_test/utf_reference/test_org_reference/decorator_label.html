<pre class="programlisting"><span class="identifier">label</span><span class="special">(</span><span class="identifier">const_string</span> <span class="identifier">label_name</span><span class="special">);</span>

<p>将测试单元与标签 <code class="computeroutput"><span class="identifier">label_name</span></code> 关联. 一个测试单元可以关联多个标签. 详见 <a class="link" href="../../tests_organization/tests_grouping.html" title="按标签把测试分组为逻辑单元">此处</a>.</p>

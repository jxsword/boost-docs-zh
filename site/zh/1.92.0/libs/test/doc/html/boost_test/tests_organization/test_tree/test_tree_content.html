<div class="titlepage"><div><div><h4 class="title">
<a name="boost_test.tests_organization.test_tree.test_tree_content"></a><a class="link" href="test_tree_content.html" title="测试树内容">测试树内容</a>
</h4></div></div></div>
<p>测试模块(因而测试树)应至少有一个安排执行的测试用例, 否则<span class="emphasis"><em>单元测试框架</em></span>会返回错误.</p>
<p>该检查在测试过滤发生之<span class="bold"><strong>后</strong></span>执行. 关于<a class="link" href="../enabling.html" title="启用或禁用测试单元执行">测试启用/禁用</a>、<a class="link" href="../tests_dependencies.html" title="管理测试依赖">测试依赖</a>和<a class="link" href="../../runtime_config/test_unit_filtering.html" title="测试单元过滤">运行期过滤</a>的章节解释了修改所运行测试的各种方法.</p>

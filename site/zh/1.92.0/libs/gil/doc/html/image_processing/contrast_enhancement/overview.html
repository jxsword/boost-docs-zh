  <section id="overview">
<h1>概述</h1>
<p>对比度增强是图像处理算法的重要组成部分. 过暗或过亮的图像在人眼看来并不美观. 因此, 尽管这些算法的主要目标是提升视觉美感, 它们在医学研究中的一些应用也很普遍.</p>
<p>GIL 图像处理套件中也有一些对比度增强算法. 其中包括:</p>
<blockquote>
<div><ol class="arabic simple">
<li><p><a class="reference internal" href="histogram_equalization.html#he"><span class="std std-ref">直方图均衡化</span></a></p></li>
<li><p><a class="reference internal" href="histogram_matching.html#hm"><span class="std std-ref">直方图匹配</span></a></p></li>
<li><p><span class="xref std std-ref">ahe</span></p></li>
<li><p>线性和非线性对比度拉伸</p></li>
</ol>
</div></blockquote>
</section>

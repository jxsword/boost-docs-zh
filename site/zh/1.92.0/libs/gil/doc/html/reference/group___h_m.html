<p>Histogram Matching(HM)  
</p>
<p>Histogram Matching(HM) </p>
<p>包含对输入图像计算全局直方图匹配的算法实现与说明.</p>
<p>算法 :- 1. 计算输入图像的直方图 A(pixel) 与参考图像的直方图 G(pixel). 2. 计算 A 与 G 的归一化累积 (CDF) 直方图. 3. 通过变换匹配两个直方图 =&gt; CDF(A(px)) = CDF(G(px')) =&gt; px' = Inv-CDF (CDF(px))</p>

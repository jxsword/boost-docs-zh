<div class="titlepage"><div><div><h3 class="title">
<a name="coroutine.stack.valgrind"></a><a class="link" href="valgrind.html" title="对 valgrind 的支持">对 valgrind 的支持</a>
</h3></div></div></div>
<p>在 valgrind 下运行切换栈的程序会导致问题. 属性 (b2 命令行) <code class="computeroutput"><span class="identifier">valgrind</span><span class="special">=</span><span class="identifier">on</span></code> 让 valgrind 把这些内存区域当作栈空间处理, 从而抑制相关错误.</p>

<p>
        <a class="indexterm" name="id83441"></a>
      </p>
<p>把整数转换为已知状态码.</p>
<h5>
<a name="beast.ref.boost__beast__http__int_to_status.h0"></a>
        <span class="phrase"><a name="beast.ref.boost__beast__http__int_to_status.synopsis"></a></span><a class="link" href="boost__beast__http__int_to_status.html#beast.ref.boost__beast__http__int_to_status.synopsis">概要</a>
      </h5>
<p>定义于头文件 <code class="literal">&lt;<a href="../../../../../../boost/beast/http/status.hpp" target="_top">boost/beast/http/status.hpp</a>&gt;</code>
      </p>
<pre class="programlisting"><span class="identifier">status</span>
<span class="identifier">int_to_status</span><span class="special">(</span>
    <span class="keyword">unsigned</span> <span class="identifier">v</span><span class="special">);</span>
</pre>
<h5>
<a name="beast.ref.boost__beast__http__int_to_status.h1"></a>

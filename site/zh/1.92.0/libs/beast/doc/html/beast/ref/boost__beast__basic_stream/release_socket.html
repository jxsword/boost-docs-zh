<p>
          <a class="indexterm" name="id15971"></a>
        </p>
<p>释放底层套接字的所有权.</p>
<h6>
<a name="beast.ref.boost__beast__basic_stream.release_socket.h0"></a>
          <span class="phrase"><a name="beast.ref.boost__beast__basic_stream.release_socket.synopsis"></a></span><a class="link" href="release_socket.html#beast.ref.boost__beast__basic_stream.release_socket.synopsis">概要</a>
        </h6>
<pre class="programlisting"><span class="identifier">socket_type</span>
<span class="identifier">release_socket</span><span class="special">();</span>
</pre>
<h6>
<a name="beast.ref.boost__beast__basic_stream.release_socket.h1"></a>
          <span class="phrase"><a name="beast.ref.boost__beast__basic_stream.release_socket.description"></a></span><a class="link" href="release_socket.html#beast.ref.boost__beast__basic_stream.release_socket.description">说明</a>
        </h6>
<p>此函数如同调用 <a class="link" href="cancel.html" title="basic_stream::cancel"><code class="computeroutput"><span class="identifier">cancel</span></code></a> 一样取消所有未完成的异步连接、读和写操作. 底层套接字的所有权随后转移给调用者.</p>

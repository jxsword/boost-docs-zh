<div class="section" id="dependencies">
<h1><a class="toc-backref" href="./technical-details.html#id72" name="dependencies">依赖</a></h1>
<p>除 <a class="reference" href="../../../config/index.html" target="_top">Boost.Config</a> 头文件外, MPL 还依赖另外三个仅头文件库:</p>
<ul class="simple">
<li><a class="reference" href="../../../preprocessor/index.html" target="_top">Boost.Preprocessor</a></li>
<li><a class="reference" href="../../../type_traits/index.html" target="_top">Boost.Type Traits</a></li>
<li><a class="reference" href="../../../static_assert/index.html" target="_top">Boost.Static Assert</a></li>
</ul>
<p>这些依赖是必需的, 无法消除. 库的<em>测试和示例</em>可能依赖一些额外的 Boost 库, 如 <a class="reference" href="../../../bind/index.html" target="_top">Boost.Bind</a>; 除非你真的想编译这些文件, 否则可以放心地忽略这些依赖.</p>
</div>

<div class="section" id="miscellaneous">
<h1><a class="toc-backref" href="./changes-in-boost-1-32-0.html#id69" name="miscellaneous">杂项</a></h1>
<ol class="arabic">
<li><p class="first"><tt class="literal"><span class="pre">vector</span></tt> 已被重新实现, 以支持在开头和末尾进行常量时间插入. 例如, 对 vector <tt class="literal"><span class="pre">v</span></tt>, 下面的代码现在是良构的:</p>
<pre class="literal-block">
typedef push_back&lt;v,int&gt;::type v1;
typedef push_front&lt;v1,int&gt;::type v2;
</pre>
</li>
<li><p class="first">一些序列构建算法 (如 <tt class="literal"><span class="pre">copy</span></tt>) 的接口已经变更. 新接口的细节请参阅<a class="reference" href="./reference-manual.html">参考手册</a>.</p>
</li>
</ol>
</div>

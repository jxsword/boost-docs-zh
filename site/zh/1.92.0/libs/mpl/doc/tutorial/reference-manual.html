<div class="section" id="reference-manual">
<h1><a class="toc-backref" href="../index.html#id61" name="reference-manual">参考手册</a></h1>
<p>MPL 参考手册是对库公共接口的带注释形式化规范. 手册有两种形式:</p>
<ul class="simple">
<li>一套完全交叉引用的 <a class="reference" href="../refmanual.html" target="_top">HTML 页面</a>.</li>
<li>交叉引用、适合打印的 <a class="reference" href="../refmanual.pdf" target="_top">PDF</a>.</li>
</ul>
<p>请选择对你最方便的形式, 并祝你使用愉快!</p>

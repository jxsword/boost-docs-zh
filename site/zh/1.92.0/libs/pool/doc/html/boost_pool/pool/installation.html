<div class="titlepage"><div><div><h3 class="title">
<a name="boost_pool.pool.installation"></a><a class="link" href="installation.html" title="安装">安装</a>
</h3></div></div></div>
<p>Boost Pool 库是一个仅头文件库. 这意味着无需构建 .lib、.dll 或 .so; 只需将 Boost 目录添加到编译器的包含文件路径中, 就可以开始使用了!</p>
